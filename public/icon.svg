<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark Deep Space Background -->
  <rect width="512" height="512" rx="110" fill="#04060a"/>
  
  <!-- Subtle tech grids -->
  <circle cx="256" cy="256" r="230" stroke="#00f3ff" stroke-width="1.5" opacity="0.15"/>
  <circle cx="256" cy="256" r="200" stroke="#a3e635" stroke-width="1" stroke-dasharray="5,8" opacity="0.15"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="140" stroke="url(#neonGlowGrad)" stroke-width="3" filter="url(#glow)" fill="none"/>

  <!-- 3D Globe Body -->
  <circle cx="256" cy="256" r="140" fill="url(#globeRadial)"/>
  
  <!-- Globe Grid / Wireframes -->
  <!-- Longitudes -->
  <ellipse cx="256" cy="256" rx="42" ry="140" stroke="#00f3ff" stroke-width="1" fill="none" opacity="0.25"/>
  <ellipse cx="256" cy="256" rx="84" ry="140" stroke="#00f3ff" stroke-width="1" fill="none" opacity="0.25"/>
  <line x1="256" y1="116" x2="256" y2="396" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Latitudes -->
  <ellipse cx="256" cy="326" rx="121" ry="27" stroke="#00f3ff" stroke-width="1" fill="none" opacity="0.25"/>
  <ellipse cx="256" cy="186" rx="121" ry="27" stroke="#a3e635" stroke-width="1" fill="none" opacity="0.25"/>
  <ellipse cx="256" cy="256" rx="140" ry="31" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Curved Orbit Ring 1 (Tilted Negative) -->
  <g transform="rotate(-22 256 256)">
    <ellipse cx="256" cy="256" rx="189" ry="53" stroke="url(#orbitGrad1)" stroke-width="4" fill="none" filter="url(#glow)"/>
    <circle cx="445" cy="256" r="6" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Curved Orbit Ring 2 (Tilted Positive) -->
  <g transform="rotate(35 256 256)">
    <ellipse cx="256" cy="256" rx="175" ry="45" stroke="url(#orbitGrad2)" stroke-width="4" fill="none" filter="url(#glowLime)"/>
    <circle cx="81" cy="256" r="5.5" fill="#ffffff" filter="url(#glowLime)"/>
  </g>

  <!-- Text Backing Plate -->
  <rect x="60" y="210" width="392" height="85" rx="18" fill="#05070c" fill-opacity="0.85" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- brand Text "ANY1 AI" with Neon Shadow & Gradient -->
  <text x="256" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="950" font-style="italic" font-size="56" fill="url(#brandTextGrad)" text-anchor="middle" dominant-baseline="middle" filter="url(#textGlow)">ANY1 AI</text>
  <!-- Text border for legibility -->
  <text x="256" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="950" font-style="italic" font-size="56" fill="none" stroke="#05070c" stroke-width="2" text-anchor="middle" dominant-baseline="middle">ANY1 AI</text>

  <!-- Subtitle -->
  <text x="256" y="335" font-family="monospace" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="6" text-anchor="middle" filter="url(#glow)">NEURAL AI NEXUS</text>
  <circle cx="256" cy="365" r="4.5" fill="#00f3ff" filter="url(#glow)"/>

  <!-- Gradients & Filters Definitions -->
  <defs>
    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="globeRadial" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#132033" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#030712" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 243, 255, 0.1)"/>
      <stop offset="50%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="rgba(163, 230, 53, 0.1)"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(163, 230, 53, 0.1)"/>
      <stop offset="50%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="rgba(0, 243, 255, 0.1)"/>
    </linearGradient>
    <linearGradient id="brandTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowLime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
